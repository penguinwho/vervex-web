<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#102e6c">
    <meta name="description" content="A little corner of the internet is under construction. Check back soon!">
    <title>Under Construction</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100svh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        padding: 24px;
        color: #102e6c;
        background: #167fc0 url("fishy.png") center / cover fixed;
      }

      body::before {
        position: fixed;
        inset: 0;
        content: "";
        background: linear-gradient(135deg, rgb(10 42 103 / 38%), rgb(6 77 133 / 18%) 55%, rgb(34 24 101 / 38%));
      }

      main {
        position: relative;
        width: min(100%, 560px);
        padding: clamp(32px, 7vw, 64px) clamp(24px, 7vw, 60px);
        border: 1px solid rgb(255 255 255 / 70%);
        border-radius: 28px;
        background: rgb(255 255 255 / 91%);
        box-shadow: 0 24px 80px rgb(8 29 83 / 35%);
        text-align: center;
        backdrop-filter: blur(12px);
        animation: surface-in 700ms cubic-bezier(.2, .75, .25, 1) both;
      }

      .mark {
        display: grid;
        width: 88px;
        height: 88px;
        margin: 0 auto 26px;
        place-items: center;
        border: 1px solid #ffdf7b;
        border-radius: 26px;
        background: #fff5d6;
        font-size: 22px;
        font-weight: 800;
        letter-spacing: 0.08em;
        transform: rotate(-5deg);
      }

      .eyebrow {
        margin: 0 0 12px;
        color: #3563ae;
        font-size: 0.76rem;
        font-weight: 800;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.4rem, 9vw, 4.5rem);
        font-weight: 850;
        letter-spacing: -0.065em;
        line-height: 0.98;
      }

      .message {
        max-width: 350px;
        margin: 20px auto 0;
        color: #4b5c7a;
        font-size: clamp(1rem, 3vw, 1.125rem);
        line-height: 1.65;
      }

      .divider {
        width: 54px;
        height: 4px;
        margin: 28px auto 20px;
        border-radius: 99px;
        background: linear-gradient(90deg, #ffb54a, #ff7599);
      }

      .social-links {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        justify-content: center;
        margin-top: 22px;
      }

      .social-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.8rem 1.2rem;
        border: 1px solid #cfe0ff;
        border-radius: 999px;
        background: #edf4ff;
        color: #163d86;
        font-size: 0.92rem;
        font-weight: 700;
        text-decoration: none;
        transition: transform 180ms ease, box-shadow 180ms ease;
      }

      .social-link:hover,
      .social-link:focus-visible {
        transform: translateY(-1px);
        box-shadow: 0 8px 22px rgb(22 61 134 / 15%);
      }

      .footer {
        margin: 18px 0 0;
        color: #71809a;
        font-size: 0.85rem;
        font-weight: 600;
      }

      @keyframes surface-in {
        from {
          opacity: 0;
          transform: translateY(18px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @media (max-width: 480px) {
        body {
          padding: 18px;
          background-attachment: scroll;
        }

        main {
          border-radius: 24px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">UPD</div>
      <p class="eyebrow">YeS</p>
      <h1>Under<br>construction</h1>
      <p class="message">We’re making a few waves behind the scenes. This little corner of the internet will be ready to swim soon.</p>
      <div class="social-links">
        <a class="social-link" href="https://discord.gg/cCvy77sVkE" target="_blank" rel="noreferrer">Discord</a>
        <a class="social-link" href="https://github.com/penguinwho" target="_blank" rel="noreferrer">GitHub</a>
        <a class="social-link" href="https://bsky.app/profile/vervex.hu" target="_blank" rel="noreferrer">Bluesky</a>
      </div>
      <div class="divider" aria-hidden="true"></div>
      <p class="footer">Thanks for stopping by!</p>
    </main>
  </body>
</html>
