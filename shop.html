<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vervex</title>
  <style>
    :root {
      --bg: #111111;
      --panel: #171717;
      --line: #2a2a2a;
      --text: #f4f0eb;
      --muted: #b5ada4;
      --accent: #d7c7b2;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.6;
    }
    a { color: inherit; text-decoration: none; }
    nav {
      border-bottom: 1px solid var(--line);
      background: rgba(17,17,17,0.96);
      position: sticky;
      top: 0;
    }
    .nav-inner {
      max-width: 900px;
      margin: 0 auto;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }
    .brand { font-weight: 700; letter-spacing: 0.04em; }
    .links { display: flex; flex-wrap: wrap; gap: 18px; color: var(--muted); }
    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 64px 20px 96px;
    }
    .eyebrow {
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.14em;
      font-size: 11px;
      margin-bottom: 16px;
    }
    h1 {
      margin: 0 0 18px;
      font-size: clamp(2.3rem, 5vw, 4rem);
      line-height: 1.05;
      letter-spacing: -0.04em;
    }
    p { color: var(--muted); font-size: 1.04rem; }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 22px;
      margin-top: 28px;
    }
    footer {
      border-top: 1px solid var(--line);
      padding: 24px 20px 40px;
      color: var(--muted);
      text-align: center;
    }
  </style>
</head>
<body>
  <nav>
    <div class="nav-inner">
      <div class="brand">VERVEX</div>
      <div class="links">
        <a href="index.html">Home</a>
        <a href="work.html">Work</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </div>
    </div>
  </nav>

  <main>
    <div class="eyebrow">shop</div>
    <h1>Nothing to buy right now.</h1>
    <p>There is no storefront here, no device listing, and no product pitch. If you want something built, use the contact page.</p>

    <div class="card">
      <p><a href="contact.html">Contact us</a> about custom work.</p>
    </div>
  </main>

  <footer>
    Vervex — simple work, no fake product launch.
  </footer>
</body>
</html>
